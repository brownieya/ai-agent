spring:
  application:
    name: brownie-ai-agent
  profiles:
    active: local
#远程向量数据库链接
  datasource:
    url: jdbc:postgresql://localhost:5432/brownie_ai_agent
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
  ai:
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
    mcp:
      client:
        # MCP 客户端初始化握手超时时间。默认仅 20s，若 mcp-servers.json 里配置的服务器是通过
        # npx 首次冷启动（需要联网下载安装依赖包），很容易超过默认值导致
        # "Client failed to initialize by explicit API call" / TimeoutException。
        # 建议本地先手动执行一次对应命令把依赖装好（或改用全局安装后的可执行文件路径），
        # 这里同时放宽超时时间作为兜底。
        request-timeout: 60s
        stdio:
          servers-configuration: classpath:mcp-servers.json
  # springdoc-openapi??????
server:
  port: 8123
  servlet:
    context-path: /api
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.brownie.brownieaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
#指定某一个类的输出级别，比如现在的SimpleLoggerAdvisor可以输出>=debug级别的日志
logging:
  level:
    org.springframework.ai.chat.client.advisor.org.springframework.ai.chat.client.advisor.MyLoggerAdvisor: debug
#searchApi
search-api:
  api-key: ${SEARCH_API_KEY:}